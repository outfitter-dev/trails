# yaml-language-server: $schema=https://raw.githubusercontent.com/outfitter-dev/skillset/main/docs/reference/schemas/0.1.0/workspace-config.schema.json
skillset:
  name: trails
workspace:
  cacheKey: trails
compile:
  build: all
  # The portable plugin package cannot represent the Claude-only agent and hook.
  unsupportedDestination: warn
  targets:
    - claude
    - codex
marketplaces:
  trails:
    title: Trails
    targets:
      - claude
    plugins:
      - plugin: trails
      - plugin: trails-dev
