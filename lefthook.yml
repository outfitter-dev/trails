# NOTE: `GIT_PAGER: cat` is set on every command. Lefthook attaches a PTY to
# stage stdout so it can render its box-style output, which tricks child `git`
# processes into thinking stdout is a real terminal. Contributors with a
# configured pager (e.g. `core.pager = delta`) then hit indefinite hangs when a
# stage invokes `git grep` / `git log` / etc., because the pager spawns inside
# the PTY and waits for terminal input that never arrives. Forcing
# `GIT_PAGER=cat` makes child git processes bypass the pager. Hook-level `env`
# in lefthook 2.1.5 does not propagate to stage children, so it must be set
# per-command. See TRL-824 for the full diagnosis.

pre-commit:
  piped: true
  commands:
    format_guard:
      priority: 1
      env:
        GIT_PAGER: cat
      run: bun run format:guard
    format:
      priority: 2
      env:
        GIT_PAGER: cat
      glob: '**/*.{ts,tsx,js,jsx,json,jsonc}'
      run: bun run format:file {staged_files}
      stage_fixed: true
    team_skills:
      priority: 4
      env:
        GIT_PAGER: cat
      glob: '{.skillset/**,skillset.yaml,skillset.lock,.claude/agents/**,.claude/skills/**,.agents/skills/**,.codex/agents/**,packages/warden/**,scripts/sync-skill-warden-guide.ts,plugin/skills/trails/references/warden-guide.md,package.json,bun.lock}'
      run: git diff --quiet -- .skillset skillset.yaml && test -z "$(git ls-files --others --exclude-standard -- .skillset skillset.yaml)" || { echo "Skillset canonical inputs have unstaged or untracked changes; stage or stash them before committing." >&2; exit 1; }; bun run skillset:sync && git add -- .skillset/skills/be-clark/references/warden-guide.md .claude/agents .claude/skills .agents/skills .codex/agents skillset.lock plugin/skills/trails/references/warden-guide.md
      stage_fixed: true
    markdownlint:
      priority: 3
      env:
        GIT_PAGER: cat
      glob: '{*.md,**/*.md}'
      run: bun run mdlint:fix {staged_files}
      stage_fixed: true

# Pre-push runs inside one `tree-guard` bracket: every check reads the live
# working tree, so a concurrent `git checkout` or edit (another agent, gt, an
# editor) mid-run produces phantom failures from a mixed tree. The guard turns
# that into an explicit "tree changed during checks" error and proves every
# pre-push verdict came from the same tree.
pre-push:
  commands:
    stable_checks:
      env:
        GIT_PAGER: cat
      run: bun scripts/tree-guard.ts run -- bun run pre-push:checks
