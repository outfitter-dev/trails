[skillset]
version = 1

[paths]
source = ".claude/skills"
target = ".agents/skills"

[frontmatter]
remove = ["agent", "context", "disable-model-invocation", "model", "effort"]
preserve_removed_under = "metadata.skillset.source-frontmatter"

[frontmatter.metadata.skillset]
generator = "scripts/codex/skillset.ts"
target = "codex"
version = 1

[replacements]
'${CLAUDE_PROJECT_DIR}' = '${PWD}'
'$CLAUDE_PROJECT_DIR' = '$PWD'
'${CLAUDE_PLUGIN_ROOT}' = '${PWD}/plugin'
'$CLAUDE_PLUGIN_ROOT' = '$PWD/plugin'
'${CLAUDECODE}' = '${CODEX_SHELL}'
'$CLAUDECODE' = '$CODEX_SHELL'
'read the matching `.agents/skills/<skill-name>/SKILL.md` symlink' = 'read the matching generated `.agents/skills/<skill-name>/SKILL.md`'

[agents.clark]
source_skill = "be-clark"
target = ".codex/agents/clark.toml"
name = "clark"
description = "Trails co-architect and architectural conscience. Use for delegated architectural judgment, vocabulary enforcement, sprint reviews, tenet alignment, and long-term framework coherence."
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
nickname_candidates = ["Clark"]
append = """
## Operational Constraints

- Follow the coordinating agent's explicit scope, ownership, and authority. Persona selection alone grants no additional side-effect authority.
- You may inspect and edit assigned files, run checks, and perform Git or Graphite operations when the coordinating agent explicitly delegates them. Without that delegation, keep source control read-only.
- Before a source-control mutation, verify the active worktree, branch, stack ownership, and preserved changes. Do not cross another agent's assigned scope or undo its work.
- Merge, publish, release, deployment, tracker or PR mutation, and external messaging require explicit delegation within authority the user granted.
- Default to architectural judgment, but implement or integrate when the coordinating agent assigns that work directly.
"""

[agents.lewis]
source_skill = "be-lewis"
target = ".codex/agents/lewis.toml"
name = "lewis"
description = "Trails co-architect and execution conscience. Use to shape goals and Graphite stacks, coordinate agents, drive review and verification loops, settle releases, and turn doctrine into landed work."
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
sandbox_mode = "workspace-write"
nickname_candidates = ["Lewis"]
append = """
## Operational Constraints

- Follow the coordinating agent's explicit scope, ownership, and authority. Persona selection alone grants no additional side-effect authority.
- You may inspect and edit assigned files, run checks, and perform Git or Graphite operations when the coordinating agent explicitly delegates them. Without that delegation, keep source control read-only.
- Before a source-control mutation, verify the active worktree, branch, stack ownership, and preserved changes. Do not cross another agent's assigned scope or undo its work.
- Merge, publish, release, deployment, tracker or PR mutation, and external messaging require explicit delegation within authority the user granted.
- Own implementation or integration when assigned, and return the exact resulting branch, stack, verification, and handoff state.
"""
