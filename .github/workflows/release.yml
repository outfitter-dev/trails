name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish packages when release policy allows manual publication'
        required: false
        default: false
        type: boolean

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  version:
    name: Version Packages
    if: github.repository == 'outfitter-dev/trails' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    outputs:
      has_changesets: ${{ steps.changesets.outputs.hasChangesets }}
      release_sha: ${{ steps.release-target.outputs.sha }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Create or update version PR
        id: changesets
        uses: changesets/action@v1
        with:
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
          version: bun run version:packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Resolve prepared release commit
        id: release-target
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          version="$(bun -e 'process.stdout.write((await Bun.file("apps/trails/package.json").json()).version)')"
          version_target="$(git log -n 1 --format=%H -S "\"version\": \"$version\"" -- apps/trails/package.json)"
          if [ -z "$version_target" ]; then
            echo "Could not resolve prepared release commit for $version" >&2
            exit 1
          fi
          echo "sha=$version_target" >> "$GITHUB_OUTPUT"
      - name: Label version PR
        if: steps.changesets.outputs.hasChangesets == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun run publish:label-release-pr
      - name: Update version PR body
        if: steps.changesets.outputs.hasChangesets == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch --no-tags origin changeset-release/main
          git checkout --force FETCH_HEAD
          bun scripts/release-notes.ts update-release-pr
      - name: Validate version PR
        if: steps.changesets.outputs.hasChangesets == 'true'
        run: |
          git fetch --no-tags origin changeset-release/main
          git checkout --force FETCH_HEAD
          bun run changeset:check
          bun run release-pack:check -- --lockfile-only
          bun run skillset:check
          bun run publish:check
      - name: Dispatch version PR CI
        if: steps.changesets.outputs.hasChangesets == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run CI --ref changeset-release/main

  publish-policy:
    name: Publish Policy
    needs: version
    if: github.repository == 'outfitter-dev/trails' && github.ref == 'refs/heads/main' && needs.version.outputs.has_changesets == 'false'
    runs-on: ubuntu-latest
    permissions:
      checks: read
      contents: read
      pull-requests: read
    outputs:
      channel: ${{ steps.policy.outputs.channel }}
      create_github_release: ${{ steps.policy.outputs.create_github_release }}
      decision: ${{ steps.policy.outputs.decision }}
      publish: ${{ steps.policy.outputs.publish }}
      release: ${{ steps.policy.outputs.release }}
      release_sha: ${{ steps.policy.outputs.release_sha }}
      should_publish: ${{ steps.policy.outputs.should_publish }}
      tag: ${{ steps.policy.outputs.tag }}
      version: ${{ steps.policy.outputs.version }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.release_sha }}
      - uses: ./.github/actions/setup
      - name: Resolve publish policy
        id: policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TRAILS_RELEASE_POLICY_CI_ATTEMPTS: '30'
          TRAILS_RELEASE_POLICY_CI_WAIT_MS: '10000'
        run: |
          release_sha="$(git rev-parse HEAD)"
          GITHUB_SHA="$release_sha" bun run publish:policy
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  publish-auto:
    name: Publish to npm automatically
    needs: publish-policy
    if: github.repository == 'outfitter-dev/trails' && github.ref == 'refs/heads/main' && needs.publish-policy.outputs.decision == 'auto' && needs.publish-policy.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment: npm-auto
    env:
      DIST_TAG: ${{ needs.publish-policy.outputs.tag }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - name: Set up npm trusted publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Pin trusted publishing npm CLI
        run: npm install --global npm@11.18.0
      - name: Verify prepared package sources
        env:
          RELEASE_SHA: ${{ needs.publish-policy.outputs.release_sha }}
        run: git diff --exit-code "$RELEASE_SHA" HEAD -- apps adapters packages bun.lock
      - name: Validate package before publish
        run: bun run publish:check
      - name: Publish packages
        run: bun run publish:packages -- --trusted-publishing --tag "$DIST_TAG"
      - name: Verify published packages
        run: bun run publish:registry-check:published --tag "$DIST_TAG"

  publish:
    name: Publish to npm manually
    needs: [publish-policy, release-asset-policy, stage-release-assets]
    if: ${{ !cancelled() && github.repository == 'outfitter-dev/trails' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.publish == true && needs.publish-policy.result == 'success' && needs.publish-policy.outputs.decision == 'manual' && needs.publish-policy.outputs.should_publish == 'true' && needs.release-asset-policy.result == 'success' && (needs.release-asset-policy.outputs.needed == 'false' || (needs.stage-release-assets.result == 'success' && needs.stage-release-assets.outputs.attempt == github.run_attempt)) }}
    runs-on: ubuntu-latest
    environment: npm
    env:
      DIST_TAG: ${{ needs.publish-policy.outputs.tag }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup
      - name: Set up npm trusted publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Pin trusted publishing npm CLI
        run: npm install --global npm@11.18.0
      - name: Verify prepared package sources
        env:
          RELEASE_SHA: ${{ needs.publish-policy.outputs.release_sha }}
        run: git diff --exit-code "$RELEASE_SHA" HEAD -- apps adapters packages bun.lock
      - name: Validate package before publish
        run: bun run publish:check
      - name: Publish packages
        run: bun run publish:packages -- --trusted-publishing --tag "$DIST_TAG"
      - name: Verify published packages
        run: bun run publish:registry-check:published --tag "$DIST_TAG"

  release-asset-policy:
    name: Check whether GitHub archives are needed
    needs: publish-policy
    if: ${{ !cancelled() && needs.publish-policy.result == 'success' && needs.publish-policy.outputs.create_github_release == 'true' && (needs.publish-policy.outputs.should_publish == 'false' || needs.publish-policy.outputs.decision == 'auto' || (github.event_name == 'workflow_dispatch' && inputs.publish == true && needs.publish-policy.outputs.decision == 'manual')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      needed: ${{ steps.release.outputs.needed }}
    steps:
      - name: Skip an already published GitHub release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish-policy.outputs.version }}
        run: |
          release_json="$(mktemp)"
          status="$(curl --silent --show-error --max-time 30 --output "$release_json" --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION")"
          case "$status" in
            200) needed="$(jq -er '.draft | select(type == "boolean") | tostring' "$release_json")" ;;
            404) needed=true ;;
            *) echo "Could not check GitHub release v$VERSION (HTTP $status)" >&2; exit 1 ;;
          esac
          echo "needed=$needed" >> "$GITHUB_OUTPUT"
      - name: Require a protected npm approval environment
        if: steps.release.outputs.needed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/$GITHUB_REPOSITORY/environments/npm" |
            jq -e 'any(.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?;
              .type == "User" and (.reviewer.id | type == "number"))' > /dev/null; then
            echo 'The npm environment must have an individually configured required reviewer before GitHub archives can be published.' >&2
            exit 1
          fi

  release-assets:
    name: Build CLI asset (${{ matrix.platform }})
    needs: [publish-policy, release-asset-policy]
    if: ${{ !cancelled() && needs.release-asset-policy.result == 'success' && needs.release-asset-policy.outputs.needed == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
          - platform: darwin-x64
            runner: macos-15-intel
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          ref: ${{ needs.publish-policy.outputs.release_sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build and cold-verify CLI release asset
        run: bun run release:cli:build -- --out-dir dist --platform "${{ matrix.platform }}" --version "${{ needs.publish-policy.outputs.version }}"
      - name: Upload CLI release asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trails-cli-${{ github.run_attempt }}-${{ matrix.platform }}
          path: dist/trails-v${{ needs.publish-policy.outputs.version }}-${{ matrix.platform }}.tar.gz
          compression-level: 0
          if-no-files-found: error

  stage-release-assets:
    name: Stage and checksum GitHub archives
    needs: [publish-policy, release-assets]
    if: ${{ !cancelled() && needs.release-assets.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
      attempt: ${{ github.run_attempt }}
      manifest_digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Download this attempt's CLI archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: trails-cli-${{ github.run_attempt }}-*
          path: release-assets
          merge-multiple: true
      - name: Assemble CLI checksum manifest
        id: manifest
        working-directory: release-assets
        env:
          VERSION: ${{ needs.publish-policy.outputs.version }}
        run: |
          manifest="trails-v$VERSION-SHA256SUMS"
          sha256sum -- "trails-v$VERSION-"{darwin-arm64,darwin-x64,linux-arm64,linux-x64}.tar.gz > "$manifest"
          digest="$(sha256sum -- "$manifest")"
          echo "digest=${digest%% *}" >> "$GITHUB_OUTPUT"
      - name: Upload immutable review artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trails-release-${{ github.run_attempt }}
          path: |
            release-assets/trails-v${{ needs.publish-policy.outputs.version }}-*.tar.gz
            release-assets/trails-v${{ needs.publish-policy.outputs.version }}-SHA256SUMS
          compression-level: 0
          if-no-files-found: error
      - name: Show archive checksums and approval comment
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          MANIFEST_DIGEST: ${{ steps.manifest.outputs.digest }}
          RELEASE_SHA: ${{ needs.publish-policy.outputs.release_sha }}
          VERSION: ${{ needs.publish-policy.outputs.version }}
        run: |
          {
            printf '## Trails v%s archives\n\nSource commit: %s\n\n' "$VERSION" "$RELEASE_SHA"
            printf '[Download the staged archives](%s)\n\n' "$ARTIFACT_URL"
            printf 'Review the checksums, then paste this exact comment when approving the npm environment deployment:\n\n'
            printf '~~~\napprove-trails-archives %s/%s/%s %s\n~~~\n\n' \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$ARTIFACT_ID" "$MANIFEST_DIGEST"
            printf '~~~\n'
            cat "release-assets/trails-v$VERSION-SHA256SUMS"
            printf '~~~\n'
          } >> "$GITHUB_STEP_SUMMARY"

  archive-approval:
    name: Approve GitHub archives (npm publication not needed here)
    needs: [publish-policy, publish-auto, stage-release-assets]
    if: ${{ !cancelled() && needs.stage-release-assets.result == 'success' && needs.stage-release-assets.outputs.attempt == github.run_attempt && (needs.publish-policy.outputs.should_publish == 'false' || needs.publish-auto.result == 'success') }}
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: ${{ needs.stage-release-assets.outputs.artifact_url }}
    permissions: {}
    steps:
      - run: echo 'Archive approval received; the separate publisher verifies the review record.'

  github-release:
    name: Publish approved GitHub Release
    needs: [publish-policy, publish, stage-release-assets, archive-approval]
    if: ${{ !cancelled() && github.repository == 'outfitter-dev/trails' && github.ref == 'refs/heads/main' && needs.stage-release-assets.result == 'success' && needs.stage-release-assets.outputs.attempt == github.run_attempt && (needs.publish.result == 'success' || needs.archive-approval.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    defaults:
      run:
        shell: bash
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Verify exact archive approval
        env:
          ARTIFACT_ID: ${{ needs.stage-release-assets.outputs.artifact_id }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_DIGEST: ${{ needs.stage-release-assets.outputs.manifest_digest }}
          STAGED_ATTEMPT: ${{ needs.stage-release-assets.outputs.attempt }}
        run: |
          if [[ "$STAGED_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ||
                ! "$ARTIFACT_ID" =~ ^[0-9]+$ || ! "$MANIFEST_DIGEST" =~ ^[0-9a-f]{64}$ ]]; then
            echo 'No complete archive artifact from this attempt; rerun all jobs.' >&2
            exit 1
          fi
          proof="approve-trails-archives $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT/$ARTIFACT_ID $MANIFEST_DIGEST"
          environment="$(gh api "repos/$GITHUB_REPOSITORY/environments/npm")"
          if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" |
            jq -e --arg proof "$proof" --argjson environment "$environment" '
              [$environment.protection_rules[]? | select(.type == "required_reviewers") |
                .reviewers[]? | select(.type == "User" and (.reviewer.id | type == "number")) | .reviewer.id] as $reviewers |
              any(.[];
                .user.id as $reviewer |
                .state == "approved" and .comment == $proof and ($reviewers | index($reviewer)) != null
                and any(.environments[]; .name == "npm" and .id == $environment.id))
            ' > /dev/null; then
            echo 'No required reviewer approved this exact archive artifact. Rerun all jobs, then approve with the new comment shown in the stage summary.' >&2
            exit 1
          fi
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Download only the approved archive artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.stage-release-assets.outputs.artifact_id }}
          path: release-assets
          merge-multiple: true
      - name: Stage, populate, and publish GitHub release
        id: release
        env:
          DIST_TAG: ${{ needs.publish-policy.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          MANIFEST_DIGEST: ${{ needs.stage-release-assets.outputs.manifest_digest }}
          VERSION_TARGET: ${{ needs.publish-policy.outputs.release_sha }}
          VERSION: ${{ needs.publish-policy.outputs.version }}
        run: |
          tag="v$VERSION"
          manifest="trails-v$VERSION-SHA256SUMS"
          cd release-assets
          printf '%s  %s\n' "$MANIFEST_DIGEST" "$manifest" | sha256sum --strict --check
          sha256sum --strict --check "$manifest"
          mapfile -t archives < <(cut -c 67- -- "$manifest")
          files=("$manifest" "${archives[@]}")
          expected_assets="$(sha256sum -- "${files[@]}" | jq -Rnc '[inputs | split("  ") | {name: .[1], digest: ("sha256:" + .[0])}] | sort_by(.name)')"
          cd ..

          if gh release view "$tag" --json isDraft > "$RUNNER_TEMP/trails-release.json"; then
            if ! jq -e '.isDraft == true' "$RUNNER_TEMP/trails-release.json" > /dev/null; then
              echo "Refusing to change published release $tag" >&2
              exit 1
            fi
          fi

          create_args=(--draft --latest=false)
          if [ "$DIST_TAG" != "latest" ]; then
            create_args+=(--prerelease)
          fi

          notes_file="$(mktemp)"
          bun scripts/release-notes.ts github-release \
            --version "$VERSION" \
            --dist-tag "$DIST_TAG" \
            > "$notes_file"
          git cat-file -e "$VERSION_TARGET^{commit}"

          git fetch --force --tags origin
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag_target="$(git rev-parse "refs/tags/$tag^{commit}")"
            if [ "$tag_target" != "$VERSION_TARGET" ]; then
              echo "$tag points to $tag_target, expected $VERSION_TARGET" >&2
              exit 1
            fi
          else
            git tag "$tag" "$VERSION_TARGET"
            git push origin "refs/tags/$tag"
          fi

          if [ ! -s "$RUNNER_TEMP/trails-release.json" ]; then
            gh release create "$tag" \
              --verify-tag \
              --title "Trails v$VERSION" \
              --notes-file "$notes_file" \
              "${create_args[@]}"
          fi

          if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]; then
            echo "Refusing to upload assets to a non-draft release $tag" >&2
            exit 1
          fi
          gh release upload "$tag" "${files[@]/#/release-assets/}" --clobber

          if ! gh release view "$tag" --json isDraft,assets |
            jq -e --argjson expected "$expected_assets" \
              '.isDraft == true and ([.assets[] | {name, digest}] | sort_by(.name)) == $expected' > /dev/null; then
            echo "Draft $tag does not contain exactly the approved assets" >&2
            exit 1
          fi
          if [ "$DIST_TAG" = "latest" ]; then
            gh release edit "$tag" --draft=false --latest
          else
            gh release edit "$tag" --draft=false --prerelease --latest=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  homebrew:
    name: Open Homebrew tap PR
    needs: github-release
    if: ${{ !cancelled() && needs.github-release.result == 'success' }}
    uses: ./.github/workflows/publish-homebrew.yml
    with:
      tag: ${{ needs.github-release.outputs.tag }}
    secrets:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
